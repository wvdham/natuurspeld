<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>NatuurSpeld</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://www.instagram.com/natuurspeld/">
<meta http-equiv="refresh" content="0; url=https://www.instagram.com/natuurspeld/">
<meta name="description" content="NatuurSpeld neemt verkeerde natuurinformatie onder de loep. Je vindt ons op Instagram.">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f7f6f2;
    color: #23301f;
    text-align: center;
    padding: 1.5rem;
  }
  main { max-width: 26rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
  p { margin: 0 0 1.25rem; line-height: 1.5; color: #55604f; }
  a.knop {
    display: inline-block;
    padding: .7rem 1.4rem;
    border-radius: 999px;
    background: #23301f;
    color: #f7f6f2;
    text-decoration: none;
    font-weight: 600;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #161b14; color: #eae7dd; }
    p { color: #a8b0a2; }
    a.knop { background: #eae7dd; color: #161b14; }
  }
</style>
<script>
  window.location.replace("https://www.instagram.com/natuurspeld/");
</script>
</head>
<body>
<main>
  <h1>NatuurSpeld</h1>
  <p>Je wordt doorgestuurd naar Instagram. Gebeurt er niets?</p>
  <a class="knop" href="https://www.instagram.com/natuurspeld/">Ga naar @natuurspeld</a>
</main>
</body>
</html>
